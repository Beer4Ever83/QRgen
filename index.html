<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; base-uri 'none'; form-action 'none'">
  <title>QRgen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>QRgen</h1>
    <form id="qr-form" novalidate>
      <label for="url-input">URL</label>
      <input id="url-input" type="text" inputmode="url" autocomplete="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://example.com" autofocus>
      <button type="submit">Generate</button>
    </form>
    <p id="error" role="alert" hidden></p>
    <section id="result" hidden>
      <img id="preview" alt="">
      <p id="encoded-url"></p>
      <p class="downloads">
        <a id="download-png" download>Download PNG</a>
        <a id="download-svg" download>Download SVG</a>
      </p>
    </section>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
